name: Build Windows installer

# Builds the Windows .exe on GitHub's servers so you never need Node.js locally.
on:
  push:
    branches:
      - main
      - claude/**
    tags:
      - 'v*'
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write          # needed to publish a Release when you push a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the installer
        run: npm run dist

      # Always make the installer downloadable from the run's "Artifacts" section.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Social-Image-Studio-Windows
          path: dist/*.exe
          if-no-files-found: error

      # When you push a version tag (e.g. v1.0.0), also publish a Release
      # with the .exe attached for an easy public download link.
      - name: Publish Release (on version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
